<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10 numara köfte — Sipariş Menüsü</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d0d0d;
      color: #f5f5f5;
      line-height: 1.5;
      padding-bottom: 110px;
    }
    header {
      background: linear-gradient(135deg, #121212, #3d080b);
      text-align: center;
      padding: 26px 16px;
      border-bottom: 2px solid #e11d2a;
    }
    header h1 {
      font-size: 25px;
      color: #ffffff;
    }
    header p {
      font-size: 13px;
      color: #ff9aa2;
      margin-top: 4px;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 16px;
    }
    .masa-box {
      background-color: #181818;
      border: 1px solid #2e1315;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .masa-box label {
      font-size: 14px;
      font-weight: 600;
      color: #ff6b74;
    }
    .masa-box select {
      background-color: #242424;
      color: #ffffff;
      border: 1px solid #441a1d;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
    }
    .category {
      margin-top: 22px;
    }
    .category-title {
      font-size: 17px;
      color: #ff2e3b;
      border-bottom: 1px solid #381416;
      padding-bottom: 6px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }
    .menu-item {
      background-color: #181818;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #2b1416;
      gap: 12px;
    }
    .item-info {
      flex: 1;
    }
    .item-name {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
    }
    .item-weight {
      display: inline-block;
      font-size: 12px;
      color: #ff6b74;
      background-color: rgba(225, 29, 42, 0.14);
      padding: 2px 8px;
      border-radius: 6px;
      margin-top: 4px;
    }
    .item-desc {
      font-size: 12px;
      color: #a8a8a8;
      margin-top: 5px;
    }
    .item-price {
      font-size: 15px;
      font-weight: 700;
      color: #ff2e3b;
      margin-top: 6px;
    }
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #222222;
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid #38181a;
    }
    .qty-btn {
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 6px;
      background-color: #e11d2a;
      color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
    .qty-btn.minus {
      background-color: #333333;
    }
    .qty-count {
      min-width: 20px;
      text-align: center;
      font-weight: 700;
      font-size: 15px;
    }
    .note-box {
      margin-top: 18px;
    }
    .note-box textarea {
      width: 100%;
      background-color: #181818;
      border: 1px solid #2e1315;
      border-radius: 10px;
      padding: 12px;
      color: #ffffff;
      font-size: 14px;
      resize: none;
      height: 70px;
    }
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #161616;
      border-top: 2px solid #e11d2a;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .cart-total {
      font-size: 14px;
      color: #cccccc;
    }
    .cart-total strong {
      display: block;
      font-size: 18px;
      color: #ffffff;
    }
    .order-btn {
      background-color: #25D366;
      color: #0b1a10;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .order-btn:disabled {
      background-color: #333333;
      color: #777777;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <h1>10 numara köfte</h1>
    <p>Seçiminizi yapın, siparişiniz direkt kasaya iletilsin</p>
  </header>

  <div class="container">

    <!-- MASA SEÇİMİ -->
    <div class="masa-box">
      <label for="masaNo">Masa Numaranız:</label>
      <select id="masaNo">
        <option value="Masa 1">Masa 1</option>
        <option value="Masa 2">Masa 2</option>
        <option value="Masa 3">Masa 3</option>
        <option value="Masa 4">Masa 4</option>
        <option value="Masa 5">Masa 5</option>
        <option value="Masa 6">Masa 6</option>
        <option value="Paket Sipariş">Paket Sipariş</option>
      </select>
    </div>

    <!-- MƏHSULLAR -->
    <div id="menuContainer"></div>

    <!-- SİPARİŞ NOTU -->
    <div class="note-box">
      <textarea id="orderNote" placeholder="Sipariş notu (örn: acısız olsun, bol soslu...)"></textarea>
    </div>

  </div>

  <!-- ALT SİPARİŞ ÇUBUĞU -->
  <div class="cart-bar">
    <div class="cart-total">
      Toplam Tutar
      <strong id="totalPrice">0 ₺</strong>
    </div>
    <button type="button" class="order-btn" id="sendOrderBtn" disabled>
      WhatsApp ile Sipariş Ver
    </button>
  </div>

  <script>
    const KASA_WHATSAPP = "994773856019";

    const MENU_DATA = [
      { category: "Köfteler", name: "Köfte Porsiyon", weight: "220 qr", desc: "Garnitür, sos ve ekmek ile.", price: 250 },
      { category: "Köfteler", name: "Köfte Dürüm", weight: "240 qr", desc: "Lavaş içinde özel sos ve yeşillik ile.", price: 220 },
      { category: "Yan Ürünler", name: "Patates Kızartması", weight: "150 qr", desc: "Sos ile servis edilir.", price: 100 },
      { category: "İçecekler", name: "Ayran", weight: "250 ml", desc: "", price: 40 },
      { category: "İçecekler", name: "Kola / Fanta", weight: "330 ml", desc: "", price: 50 }
    ];

    const quantities = MENU_DATA.map(() => 0);

    function renderMenu() {
      const container = document.getElementById("menuContainer");
      const categories = [...new Set(MENU_DATA.map(item => item.category))];
      let html = "";

      categories.forEach(cat => {
        html += `<section class="category"><h2 class="category-title">${cat}</h2>`;
        MENU_DATA.forEach((item, index) => {
          if (item.category === cat) {
            html += `
              <div class="menu-item">
                <div class="item-info">
                  <div class="item-name">${item.name}</div>
                  ${item.weight ? `<span class="item-weight">${item.weight}</span>` : ""}
                  ${item.desc ? `<p class="item-desc">${item.desc}</p>` : ""}
                  <div class="item-price">${item.price} ₺</div>
                </div>
                <div class="qty-controls">
                  <button type="button" class="qty-btn minus" data-index="${index}" data-delta="-1">-</button>
                  <span class="qty-count" id="qty-${index}">${quantities[index]}</span>
                  <button type="button" class="qty-btn plus" data-index="${index}" data-delta="1">+</button>
                </div>
              </div>
            `;
          }
        });
        html += `</section>`;
      });

      container.innerHTML = html;

      container.querySelectorAll(".qty-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const index = Number(btn.dataset.index);
          const delta = Number(btn.dataset.delta);
          changeQty(index, delta);
        });
      });
    }

    const params = new URLSearchParams(window.location.search);
    const masaParam = params.get("masa");
    if (masaParam) {
      const select = document.getElementById("masaNo");
      const target = "Masa " + masaParam;
      for (const opt of select.options) {
        if (opt.value.toLowerCase() === target.toLowerCase()) {
          select.value = opt.value;
        }
      }
    }

    function changeQty(index, delta) {
      const nextVal = quantities[index] + delta;
      quantities[index] = nextVal < 0 ? 0 : nextVal;
      const countEl = document.getElementById("qty-" + index);
      if (countEl) {
        countEl.textContent = quantities[index];
      }
      updateCart();
    }

    function updateCart() {
      let total = 0;
      let totalItems = 0;
      MENU_DATA.forEach((item, index) => {
        const count = quantities[index];
        total += item.price * count;
        totalItems += count;
      });
      document.getElementById("totalPrice").textContent = total + " ₺";
      document.getElementById("sendOrderBtn").disabled = totalItems === 0;
    }

    function sendWhatsApp() {
      const masa = document.getElementById("masaNo").value;
      const note = document.getElementById("orderNote").value.trim();
      const lines = [];
      let total = 0;

      MENU_DATA.forEach((item, index) => {
        const count = quantities[index];
        if (count > 0) {
          lines.push(`• ${count}x ${item.name} (${item.price * count} ₺)`);
          total += item.price * count;
        }
      });

      if (lines.length === 0) return;

      let message = `*10 numara köfte — Yeni Sipariş*\n`;
      message += `*Konum:* ${masa}\n\n`;
      message += lines.join("\n");
      message += `\n\n*Toplam:* ${total} ₺`;
      if (note) {
        message += `\n*Not:* ${note}`;
      }

      const url = `https://wa.me/${KASA_WHATSAPP}?text=${encodeURIComponent(message)}`;
      window.open(url, "_blank");
    }

    document.getElementById("sendOrderBtn").addEventListener("click", sendWhatsApp);
    renderMenu();
  </script>

</body>
</html>
